<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F0EEE6">
  <title>страница не найдена — линия дня</title>
  <style>
    :root { color-scheme: light; --paper: #f4e7b2; --ink: #171717; --signal: #e85d3f; --cobalt: #163bff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 Georgia, serif; }
    main { width: min(520px, calc(100% - 40px)); padding: 28px; border: 2px solid var(--ink); background: #fbfaf3; }
    h1 { margin: 0 0 12px; font: 700 clamp(42px, 10vw, 80px)/.85 Impact, "Arial Narrow", sans-serif; letter-spacing: -.03em; }
    p { max-width: 38em; margin: 0 0 20px; }
    a { display: inline-block; padding: 10px 14px; border: 1px solid var(--ink); background: var(--cobalt); color: #fff; text-decoration: none; }
    a:hover, a:focus-visible { background: var(--signal); color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <h1>страница не найдена</h1>
    <p>ссылка ведёт не туда. вернитесь на линию дня и выберите другую дату.</p>
    <a href="index.html">открыть линию дня</a>
  </main>
  <script>
    const target = new URL('index.html', window.location.href);
    target.search = window.location.search;
    document.querySelector('a').href = target.href;
  </script>
</body>
</html>
